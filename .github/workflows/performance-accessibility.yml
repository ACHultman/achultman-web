name: 'Performance & Accessibility CI'

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read
    deployments: read

jobs:
    perf-access:
        name: Lighthouse & Accessibility Audit
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
              with:
                  node-version: 24.x
                  cache: 'npm'

            - name: Install dependencies
              env:
                  PUPPETEER_SKIP_DOWNLOAD: true
              run: npm ci

            - name: Audit all dependencies
              run: npm audit --audit-level=low

            - name: Get Vercel deployment URL
              id: vercel_deployment
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  DEPLOYMENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
                  DEPLOYMENT_ENV: ${{ github.event_name == 'push' && 'production' || 'preview' }}
              run: node scripts/resolve-deployment.cjs

            - name: Confirm deployment URL
              env:
                  DEPLOYMENT_URL: ${{ steps.vercel_deployment.outputs.url }}
              run: printf 'Deployment ready at %s\n' "$DEPLOYMENT_URL"

            - name: Install audit browser
              run: npx playwright install --with-deps chromium

            - name: Run Lighthouse CI
              env:
                  VERCEL_ENV: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
                  AUDIT_BASE_URL: ${{ github.event_name == 'push' && 'https://hultman.dev' || steps.vercel_deployment.outputs.url }}
                  VERCEL_PREVIEW_URL: ${{ steps.vercel_deployment.outputs.url }}
                  VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
              run: npx --no-install lhci autorun --config=.lighthouserc.js

            - name: Run accessibility checks
              env:
                  CI: true
                  PLAYWRIGHT_BASE_URL: ${{ github.event_name == 'push' && 'https://hultman.dev' || steps.vercel_deployment.outputs.url }}
                  VERCEL_PREVIEW_URL: ${{ steps.vercel_deployment.outputs.url }}
                  VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
              run: npm run a11y -- --workers=2
