name: 'Performance & Accessibility CI'

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read
    deployments: read

jobs:
    perf-access:
        name: Lighthouse & Accessibility Audit
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
              with:
                  node-version: 24.x
                  cache: 'npm'

            - name: Install dependencies
              env:
                  PUPPETEER_SKIP_DOWNLOAD: true
              run: npm ci

            - name: Audit all dependencies
              run: npm audit --audit-level=low

            - name: Get Vercel deployment URL
              id: vercel_deployment
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  DEPLOYMENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
              run: |
                  for attempt in {1..36}; do
                    deployment_id="$(gh api "repos/${GH_REPO}/deployments?sha=${DEPLOYMENT_SHA}&per_page=10" --jq '.[0].id // empty')"

                    if [ -n "$deployment_id" ]; then
                      deployment_url="$(gh api "repos/${GH_REPO}/deployments/${deployment_id}/statuses" --jq 'map(select(.state == "success" and .environment_url != null))[0].environment_url // empty')"

                      if [ -n "$deployment_url" ]; then
                        echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
                        exit 0
                      fi
                    fi

                    sleep 5
                  done

                  echo "::error::No successful Vercel deployment found for ${DEPLOYMENT_SHA}"
                  exit 1

            - name: Confirm deployment URL
              env:
                  DEPLOYMENT_URL: ${{ steps.vercel_deployment.outputs.url }}
              run: printf 'Deployment ready at %s\n' "$DEPLOYMENT_URL"

            - name: Install audit browser
              run: npx playwright install --with-deps chromium

            - name: Run Lighthouse CI
              env:
                  VERCEL_ENV: preview
                  VERCEL_PREVIEW_URL: ${{ steps.vercel_deployment.outputs.url }}
                  VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
              run: npx --no-install lhci autorun --config=.lighthouserc.js

            - name: Run accessibility checks
              env:
                  CI: true
                  VERCEL_PREVIEW_URL: ${{ steps.vercel_deployment.outputs.url }}
                  VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
              run: npm run a11y -- --workers=2
